name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: ${{ steps.project.outputs.pages_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Create or verify Cloudflare Pages project
        id: project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: kashiteluguguide
        run: node scripts/ensure-cloudflare-pages.mjs
      - name: Prepare public website files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js credits.html .nojekyll _site/
          cp -R assets _site/assets
      - name: Deploy website to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy _site --project-name=${{ steps.project.outputs.project_name }} --branch=main
      - name: Record production URL
        env:
          PAGES_URL: ${{ steps.project.outputs.pages_url }}
          PAGES_ENVIRONMENT: ${{ steps.deployment.outputs.pages-environment }}
        run: |
          if [ "$PAGES_ENVIRONMENT" != "production" ]; then
            echo "Cloudflare did not report a production deployment."
            exit 1
          fi
          echo "Cloudflare deployment succeeded: $PAGES_URL"
          printf '### Cloudflare Pages\n\n[Visit the website](%s)\n' "$PAGES_URL" >> "$GITHUB_STEP_SUMMARY"
